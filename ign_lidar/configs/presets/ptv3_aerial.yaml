# ============================================================================
# IGN LiDAR HD - Preset: PTv3 Aerial (Pointcept-ready training set)
# ============================================================================
# Inherits: base.yaml
#
# USE CASE: Export patches as a Pointcept-compatible dataset for fine-tuning
#           Point Transformer V3 (PTv3) on aerial LiDAR HD data.
#
# OUTPUT LAYOUT:
#   <output_root>/
#     meta.json
#     train/<patch_id>/{coord,feat,segment}.npy
#     val/<patch_id>/{coord,feat,segment}.npy
#     test/<patch_id>/{coord,feat,segment}.npy
#
# KEY DESIGN CHOICES:
#   - No voxelisation: PTv3 voxelises at train time (Pointcept GridSample,
#     recommended grid_size=0.15m for aerial).
#   - Labels remapped to contiguous [0..6] with -1 ignore_index — required by
#     Pointcept's CrossEntropy / Lovasz losses.
#   - Splits assigned BY TILE, not by patch, to avoid spatial leakage.
# ============================================================================

defaults:
  - ../base
  - _self_

config_version: "5.1.0"
preset_name: "ptv3_aerial"

# Phase 4 async optimizer routes tiles through tile_orchestrator.process_tile()
# which does not exist on TileOrchestrator and silently produces 0 patches.
# Fall back to the standard sequential path which goes through TileProcessor.
enable_optimizations: false

# Processor: target PTv3 / Pointcept training pipeline
processor:
  lod_level: "LOD2"
  processing_mode: "enriched_and_patches"
  architecture: "ptv3"
  # MUST be set here too: the Hydra default (processor.output_format: laz) otherwise
  # wins over output.format and the PTv3/Pointcept writer is never selected.
  output_format: "ptv3_pointcept"
  use_gpu: true
  num_workers: 4
  patch_overlap: 0.1          # light overlap: avoids splitting buildings at patch borders (LOD2/LOD3)
  patch_size: 150.0
  num_points: -1              # disabled: PTv3 does not require fixed N
  min_points: 10000           # drop near-empty patches
  min_building_points: 300    # building-oriented dataset: keep patches with >= 300 building pts
  building_class: 6           # ASPRS building class (6)
  augment: false              # all augmentation lives in Pointcept transforms
  num_augmentations: 0

# Features required for the default PTv3 feat stack
features:
  mode: "lod2"
  compute_normals: true       # normals (3) — wall verticality
  compute_curvature: false
  compute_height: true        # height_above_ground — roof vs ground
  compute_geometric: true     # planarity, linearity, verticality (LOD2 building cues)
  compute_architectural: true # wall_score, roof_score (building-specific)
  use_rgb: true               # fetch BD ORTHO → rgb (mineral vs vegetation)
  use_infrared: true          # fetch IRC → nir (needed for ndvi)
  compute_ndvi: true          # ndvi — kills vegetation false-positives on roofs

# Output: PTv3 / Pointcept layout
output:
  format: "ptv3_pointcept"
  save_enriched: false
  save_patches: true
  save_metadata: true
  save_stats: true

  ptv3:
    layout: "folder"          # "folder" or "pth"
    # Enriched feature stack for LOD2 building segmentation:
    #   spectral (rgb, ndvi) + height + geometry (normals, verticality, planarity)
    #   + building scores (wall/roof). All produced by the features block above.
    feat_keys: ["rgb", "ndvi", "height_above_ground", "normals",
                "verticality", "planarity", "wall_score", "roof_score",
                "return_number"]
    label_schema: "lidar_hd_7cl_contiguous"
    center_xy: true
    anchor_z_min: true

    split:
      strategy: "by_tile"     # by_tile | by_patch  (by_tile prevents leakage)
      train: 0.8
      val: 0.1
      test: 0.1
      seed: 42

# Data sources: ground-truth refinement before export
data_sources:
  bd_topo:
    enabled: true
    features:
      buildings: true
      roads: true
      water: true
      vegetation: false

preprocess:
  enabled: false

stitching:
  enabled: false
